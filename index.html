
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATSYZ - Gestión HSE Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.cdnfonts.com/css/arial-nova" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'syz-red': '#CC1E1E', 
              'syz-gray-x11': '#BEBEBE',
              'syz-onyx': '#444444',
              'syz-jet': '#08131A',
              'syz-white': '#FFFFFF',
              'syz-light-gray': '#F2F2F2',
            },
            fontFamily: {
              sans: ['Arial Nova Light', 'Arial', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
        body { 
          font-family: 'Arial Nova Light', Arial, sans-serif; 
          background-color: #FFFFFF;
          color: #08131A;
          font-size: 9pt;
        }
        
        h1, .text-title { font-size: 12pt; font-weight: bold; text-transform: uppercase; }
        h2, .text-subtitle { font-size: 10pt; font-weight: bold; }
        p, span, label, input, select, textarea { font-size: 9pt; }

        input[type="text"], 
        input[type="number"], 
        input[type="datetime-local"], 
        select {
          background-color: #F2F2F2 !important;
          color: #000000 !important;
          border: 1px solid #444444;
          padding: 0 12px;
          border-radius: 4px;
          height: 42px;
          width: 100%;
          box-sizing: border-box;
          outline: none;
        }

        textarea {
          background-color: #F2F2F2 !important;
          color: #000000 !important;
          border: 1px solid #444444;
          padding: 12px;
          border-radius: 4px;
          width: 100%;
          box-sizing: border-box;
          outline: none;
        }

        @media print {
          @page { 
            size: portrait; 
            margin: 10mm 10mm 10mm 10mm; 
          }
          html, body {
            margin: 0 !important;
            padding: 0 !important;
            background: #FFFFFF !important;
            width: 100% !important;
          }
          body * { visibility: hidden !important; }
          #print-area, #print-area * { visibility: visible !important; }
          #print-area {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            display: block !important;
            background: #FFFFFF !important;
            overflow: visible !important;
          }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CC1E1E; border-radius: 10px; }
        
        .atsyz-brand {
          font-family: 'Arial Black', sans-serif;
          letter-spacing: -1px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "jspdf": "https://esm.sh/jspdf@^2.5.1",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="antialiased">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
